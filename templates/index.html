<!DOCTYPE html>
<html lang="zh" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash 节点检测器</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <!-- CodeMirror for YAML syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
    <main class="container" x-data="app()" x-init="init()">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-mark" aria-hidden="true">C<span>↗</span></div>
            <div>
                <h1>Clash IP Checker</h1>
                <p>检测节点 IP 质量，整理并导出订阅</p>
            </div>
        </header>

        <!-- Input Section (6:4 ratio) -->
        <div class="grid input-grid">
            <!-- YAML Input (60%) -->
            <div class="yaml-column">
                <div class="editor-heading">
                    <div><h2>订阅内容</h2><p>粘贴 Clash YAML 配置，开始检测节点</p></div>
                    <span class="format-tag">YAML</span>
                </div>
                <div id="yaml-editor" class="yaml-editor" aria-label="YAML 订阅内容"></div>
            </div>

            <!-- Config Panel -->
            <div>

                <div class="config-panel">
                    <!-- 核心配置 -->
                    <fieldset>
                        <legend>核心配置</legend>
                        <label style="margin-bottom: 0.5rem;">
                            <input type="checkbox" x-model="config.fast_mode"
                                :disabled="isRunning || isRechecking">
                            极速模式 (使用 API 接口，无 Bot 比例)
                        </label>

                        <label style="font-size: 0.9em; margin-bottom: 0.4rem;">
                            检测源
                            <select x-model="config.source" :disabled="isRunning || isRechecking"
                                style="margin-top: 0.2rem; padding: 0.4rem;">
                                <option value="both">双源检测（推荐）</option>
                                <option value="ping0">Ping0 优先</option>
                                <option value="ippure">IPPure 优先</option>
                            </select>
                        </label>
                        <small x-show="config.source === 'both'" style="display: block; margin-bottom: 0.75rem;">
                            同时显示两家的评分和 IP 属性；一家失败不影响另一家，不计算总分。
                        </small>
                        <label x-show="config.source !== 'both'" style="font-size: 0.9em; margin-bottom: 0.75rem;">
                            <input type="checkbox" x-model="config.fallback"
                                :disabled="isRunning || isRechecking">
                            数据源降级 (主源失败时尝试另一家)
                        </label>
                        <label>
                            Clash API 地址 （Clash-设置-外部控制查看）
                            <input type="text" x-model="config.clash_api_url" placeholder="http://127.0.0.1:9097">
                        </label>
                        <label>
                            Clash API 密钥（同上查看）
                            <input type="text" x-model="config.clash_api_secret" placeholder="留空表示无密码">
                        </label>
                    </fieldset>

                    <!-- 可选配置 (默认折叠) -->
                    <details class="config-details" style="margin-top: -0.5rem;">
                        <summary>可选配置</summary>

                        <label>
                            输出文件后缀
                            <input type="text" x-model="config.output_suffix" placeholder="_checked">
                        </label>
                        <label>
                            代理组名称 (用于切换节点)
                            <input type="text" x-model="config.selector_name" placeholder="GLOBAL">
                        </label>
                        <!-- 仅非极速模式显示 -->
                        <label x-show="!config.fast_mode" x-transition>
                            <input type="checkbox" x-model="config.headless">
                            隐藏浏览器窗口
                        </label>

                        <label
                            style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed rgba(255,255,255,0.1);">
                            跳过关键词 (逗号分隔)
                            <small
                                style="display: block; color: var(--text-muted); margin-bottom: 0.5rem;">包含以下词的节点将被跳过</small>
                            <input type="text" x-model="config.skip_keywords_str"
                                placeholder="剩余,重置,到期,有效期,官网,网址,更新,公告,建议">
                        </label>
                    </details>




                    <div class="button-group">
                        <button @click="startCheck" :disabled="isRunning || isRechecking || !yamlContent.trim()" :aria-busy="isRunning">
                            <span x-show="!isRunning">🚀 开始检测</span>
                            <span x-show="isRunning">检测中...</span>
                        </button>
                        <button @click="stopCheck" x-show="isRunning" :disabled="isStopping" class="secondary">
                            <span x-text="isStopping ? '正在恢复...' : '⏹ 停止'"></span>
                        </button>
                    </div>
                    <small x-show="error" x-text="error" class="error-text"
                        style="display: block; text-align: center; margin-top: 0.5rem; transition: all 0.3s ease;"></small>
                </div>
            </div>
        </div>



        <!-- Results Table -->
        <section x-show="nodes.length > 0" class="results-section">
            <div class="results-header">
                <h3>节点列表 (<span x-text="nodes.length"></span>)</h3>

                <!-- Compact Progress -->
                <div x-show="showProgress"
                    style="flex: 1; margin: 0 1.5rem; display: flex; flex-direction: column; justify-content: center; min-width: 200px;">
                    <progress :value="progress" :max="total"
                        style="width: 100%; height: 6px; margin-bottom: 2px;"></progress>
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #888;">
                        <span x-text="currentNode"
                            style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;"></span>
                        <span x-text="`${progress}/${total}`"></span>
                    </div>
                </div>

                <div class="results-actions">

                    <button class="small" @click="exportYaml" :disabled="selected.length === 0">
                        📥 导出选中 (<span x-text="selected.length"></span>)
                    </button>
                </div>
            </div>

            <small class="table-scroll-hint">左右滑动查看完整结果</small>
            <div class="table-scroll">
                <table role="grid">
                    <thead>
                        <tr>
                            <th><input type="checkbox" @change="toggleAll"
                                    :checked="selected.length === nodes.length"></th>
                            <th>节点名</th>
                            <th>出口 IP</th>
                            <th>Ping0 风控</th>
                            <th>Ping0 共享</th>
                            <th>IPPure 评分</th>
                            <th>IPPure Bot</th>
                            <th>IP 类型</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="node in nodes" :key="node.id">
                            <tr :class="{
                                    'degraded': node.status === '⚠️ 降级',
                                    'partial': node.check_status === 'partial',
                                    'ip-mismatch-row': node.ip_mismatch
                                }">
                                <td>
                                    <input type="checkbox" :value="node.id" x-model="selected">
                                </td>
                                <td class="node-cell">
                                    <span x-show="editingId !== node.id" x-text="node.name"
                                        @dblclick="startEdit(node)" class="editable"></span>
                                    <input x-show="editingId === node.id" x-model="editValue"
                                        @blur="saveEdit(node)" @keyup.enter="saveEdit(node)"
                                        @keyup.escape="cancelEdit" class="inline-edit">
                                </td>
                                <td class="source-stack">
                                    <div x-show="hasSource(node, 'ping0')" :title="sourceError(node, 'ping0')">
                                        <span class="source-tag ping0">Ping0</span>
                                        <span x-text="sourceIp(node, 'ping0')"></span>
                                    </div>
                                    <div x-show="hasSource(node, 'ippure')" :title="sourceError(node, 'ippure')">
                                        <span class="source-tag ippure">IPPure</span>
                                        <span x-text="sourceIp(node, 'ippure')"></span>
                                    </div>
                                </td>
                                <td :title="sourceError(node, 'ping0')">
                                    <span :class="sourceRiskClass(node, 'ping0')"
                                        x-text="sourceScore(node, 'ping0')"></span>
                                    <button type="button" class="source-error" x-show="sourceErrorDetail(node, 'ping0')"
                                        @click="errorDetail = sourceErrorDetail(node, 'ping0'); $refs.errorModal.showModal()"
                                        aria-label="查看 Ping0 完整错误信息" x-text="sourceErrorDetail(node, 'ping0')"></button>
                                </td>
                                <td :title="sourceError(node, 'ping0')">
                                    <span :class="sourceSharedClass(node)"
                                        x-text="sourceShared(node)"></span>
                                </td>
                                <td :title="sourceError(node, 'ippure')">
                                    <span :class="sourceRiskClass(node, 'ippure')"
                                        x-text="sourceScore(node, 'ippure')"></span>
                                    <button type="button" class="source-error" x-show="sourceErrorDetail(node, 'ippure')"
                                        @click="errorDetail = sourceErrorDetail(node, 'ippure'); $refs.errorModal.showModal()"
                                        aria-label="查看 IPPure 完整错误信息" x-text="sourceErrorDetail(node, 'ippure')"></button>
                                </td>
                                <td :title="sourceError(node, 'ippure')">
                                    <span :class="sourceBotClass(node)"
                                        x-text="sourceBot(node)"></span>
                                </td>
                                <td class="source-stack">
                                    <div x-show="hasSource(node, 'ping0')">
                                        <span class="source-tag ping0">Ping0</span>
                                        <span :class="sourceIdentityClass(node, 'ping0')"
                                            x-text="sourceIdentity(node, 'ping0')"></span>
                                    </div>
                                    <div x-show="hasSource(node, 'ippure')">
                                        <span class="source-tag ippure">IPPure</span>
                                        <span :class="sourceIdentityClass(node, 'ippure')"
                                            x-text="sourceIdentity(node, 'ippure')"></span>
                                    </div>
                                </td>
                                <td :title="node.error || ''">
                                    <span :class="nodeStatusClass(node)" x-text="nodeStatusText(node)"></span>
                                    <small x-show="node.ip_mismatch" class="mismatch-hint"
                                        title="两家检测源看到的出口 IP 不同">Ping0 与 IPPure 不同</small>
                                </td>
                                <td class="actions-cell">
                                    <button class="small outline" aria-label="编辑节点名称" title="编辑节点名称" @click="startEdit(node)"
                                        :disabled="isRunning || isRechecking">✏️</button>
                                    <button class="small outline secondary" aria-label="重新检测此节点" @click="recheckNode(node)"
                                        :disabled="isRunning || isRechecking" title="重新检测此节点">
                                        <span x-show="recheckingId !== node.id">🔄</span>
                                        <span x-show="recheckingId === node.id"
                                            style="opacity:0.5">⏳</span>
                                    </button>
                                    <button class="small outline danger" aria-label="删除节点" title="删除节点" @click="deleteNode(node)"
                                        :disabled="isRunning || isRechecking">🗑️</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>

        <dialog x-ref="errorModal" aria-labelledby="error-detail-title">
            <article class="error-dialog">
                <header>
                    <button aria-label="关闭" class="close" @click="$refs.errorModal.close()"></button>
                    <h3 id="error-detail-title">检测失败详情</h3>
                </header>
                <p x-text="errorDetail"></p>
                <footer><button class="secondary" @click="$refs.errorModal.close()">关闭</button></footer>
            </article>
        </dialog>

        <!-- Export Modal -->
        <dialog x-ref="exportModal">
            <article>
                <header>
                    <button aria-label="Close" class="close" @click="$refs.exportModal.close()"></button>
                    <h3>导出 YAML</h3>
                </header>
                <!-- CodeMirror container for syntax highlighting -->
                <div id="export-editor" style="margin-bottom: 1rem;"></div>
                <footer>
                    <div style="display: flex; gap: 0.5rem; width: 100%;">
                        <button @click="downloadYaml">💾 下载</button>
                        <button class="secondary" @click="copyYaml">📋 复制</button>
                        <button class="contrast" @click="importToClash" style="margin-left: auto;">🚀 导入 Clash</button>
                    </div>
                </footer>
            </article>
        </dialog>
    </main>

    <script src="/static/js/app.js?v=2"></script>
</body>

</html>
